name: Build and Release DMG

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      LANGUAGE_SWITCHER_DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check version and toolchain
        id: metadata
        run: |
          version="$(bash scripts/app-version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "xcode=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: Tools/dmg-requirements.txt

      - name: Restore Xcode build cache
        uses: actions/cache@v6
        with:
          path: ${{ env.LANGUAGE_SWITCHER_DERIVED_DATA }}
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.metadata.outputs.xcode }}-${{ hashFiles('LanguageSwitcher.xcodeproj/project.pbxproj') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.metadata.outputs.xcode }}-${{ hashFiles('LanguageSwitcher.xcodeproj/project.pbxproj') }}-

      - name: Test
        run: bash scripts/ci-annotate.sh Test bash scripts/test.sh

      - name: Build and verify Universal DMG
        run: bash scripts/ci-annotate.sh "Build DMG" bash scripts/package-dmg.sh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: LanguageSwitcher-${{ steps.metadata.outputs.version }}
          path: |
            dist/LanguageSwitcher.dmg
            dist/LanguageSwitcher.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/build.log
            build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Build summary
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          {
            printf '### LanguageSwitcher %s\n\n' "$APP_VERSION"
            printf 'macOS 14+ · Apple Silicon + Intel · ad-hoc signed\n\n'
            printf 'Download the DMG and its SHA-256 from this run’s installer artifact.\n\n'
            printf '```text\n'
            cat dist/LanguageSwitcher.dmg.sha256
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    # PRs, branch pushes and manual runs build artifacts; only a pushed tag publishes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: LanguageSwitcher-${{ needs.build.outputs.version }}
          path: dist

      - name: Verify downloaded installer
        working-directory: dist
        run: sha256sum -c LanguageSwitcher.dmg.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/LanguageSwitcher.dmg dist/LanguageSwitcher.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/LanguageSwitcher.dmg dist/LanguageSwitcher.dmg.sha256 \
              --verify-tag --title "LanguageSwitcher $GITHUB_REF_NAME" --generate-notes
          fi
